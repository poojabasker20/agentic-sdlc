name: Stage 1 - User Story Refiner Agent

on:
  # Trigger 1: When a goal file is added or modified in goals/
  push:
    branches:
      - main
    paths:
      - "goals/**.md"

  # Trigger 2: When a human reviewer comments on a PR
  issue_comment:
    types: [created]

  # Trigger 3: Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story Identifier (e.g. STORY-101)"
        required: false
        default: "STORY-101"
      goal_file:
        description: "Path to goal file (e.g. goals/GOAL-101.md)"
        required: false
        default: "goals/GOAL-101.md"

jobs:
  refine-user-story:
    name: Run User Story Refiner
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        !endsWith(github.event.comment.user.login, '[bot]') &&
        !startsWith(github.event.comment.body, '🤖')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Governance Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute User Story Refiner Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          TARGET_CODEBASE_REPO: ${{ vars.TARGET_CODEBASE_REPO || 'owner/springboot-hello-world' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          MANUAL_STORY_ID: ${{ inputs.story_id }}
          MANUAL_GOAL_FILE: ${{ inputs.goal_file }}
        run: |
          python run_workflow.py --ci
