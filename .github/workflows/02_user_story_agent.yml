name: 02 - Stage 1 User Story Refiner Agent

on:
  # Manual Trigger
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story Identifier (e.g. STORY-101)"
        required: true
        default: "STORY-101"
      goal_file:
        description: "Path to goal document (e.g. goals/GOAL-101.md)"
        required: true
        default: "goals/GOAL-101.md"

  # PR Conversation comments
  issue_comment:
    types: [created]

  # Inline Code Diff comments
  pull_request_review_comment:
    types: [created]

  # Submitted PR Reviews
  pull_request_review:
    types: [submitted]

jobs:
  refine-user-story:
    name: Run User Story Refiner
    # Prevent bot feedback loops
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
          github.event_name == 'pull_request_review_comment' ||
          github.event_name == 'pull_request_review'
        ) &&
        !endsWith(github.actor, '[bot]')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: 1. Checkout Governance Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: 3. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Start Agentic SDLC FastAPI Service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: "europe-west1"
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > fastapi.log 2>&1 &
          echo "Waiting for FastAPI service to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "✓ FastAPI service is healthy and ready!"
              break
            fi
            sleep 1
          done

      - name: 6. Execute User Story Refiner Agent (POST /api/v1/agent/user-story)
        run: |
          pr_num="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -z "$pr_num" ]; then
            pr_num="null"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/api/v1/agent/user-story \
            -H "Content-Type: application/json" \
            -d "{
              \"story_id\": \"${{ inputs.story_id }}\",
              \"goal_file\": \"${{ inputs.goal_file }}\",
              \"sdlc_repo\": \"${{ github.repository }}\",
              \"event_name\": \"${{ github.event_name }}\",
              \"pr_number\": $pr_num
            }")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "User Story Agent API request failed!"
            cat fastapi.log
            exit 1
          fi
