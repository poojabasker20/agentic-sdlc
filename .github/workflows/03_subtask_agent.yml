name: Stage 2 Subtask Generator Agent

on:
  # Manual Trigger
  workflow_dispatch:
    inputs:
      story_id:
        description: "Story Identifier (e.g. STORY-101)"
        required: true
        default: "STORY-101"
      story_file:
        description: "Path to refined user story (e.g. user-stories/STORY-101.md)"
        required: true
        default: "user-stories/STORY-101.md"
      target_codebase_repo:
        description: "Target Codebase Repository"
        required: false
        default: "poojabasker20/springboot-hello-world"

  # Trigger ONLY once when the reviewer submits/publishes their PR review
  pull_request_review:
    types: [submitted]

# Prevent duplicate / overlapping runs on the same PR
concurrency:
  group: user-subtask-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-subtasks:
    name: Run Subtask Generator
    # Prevent bot feedback loops
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review' &&
        !endsWith(github.actor, '[bot]')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Governance Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Agentic SDLC FastAPI Service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          TARGET_CODEBASE_REPO: ${{ inputs.target_codebase_repo || vars.TARGET_CODEBASE_REPO || 'poojabasker20/springboot-hello-world' }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: "europe-west1"
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > fastapi.log 2>&1 &
          echo "Waiting for FastAPI service to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "✓ FastAPI service is healthy and ready!"
              break
            fi
            sleep 1
          done

      - name: Execute Subtask Generator Agent (POST /api/v1/agent/subtasks)
        run: |
          pr_num="${{ github.event.pull_request.number }}"
          if [ -z "$pr_num" ]; then
            pr_num="null"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/api/v1/agent/subtasks \
            -H "Content-Type: application/json" \
            -d "{
              \"story_id\": \"${{ inputs.story_id || 'STORY-101' }}\",
              \"story_file\": \"${{ inputs.story_file || 'user-stories/STORY-101.md' }}\",
              \"target_codebase_repo\": \"${{ inputs.target_codebase_repo || vars.TARGET_CODEBASE_REPO || 'poojabasker20/springboot-hello-world' }}\",
              \"sdlc_repo\": \"${{ github.repository }}\",
              \"event_name\": \"${{ github.event_name }}\",
              \"pr_number\": $pr_num
            }")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Subtask Agent API request failed!"
            cat fastapi.log
            exit 1
          fi
