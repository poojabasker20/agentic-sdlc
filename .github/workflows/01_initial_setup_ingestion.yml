name: 01 - Initial Setup & Context Ingestion (AST & Docs)

on:
  workflow_dispatch:
    inputs:
      target_codebase_repo:
        description: "Target Codebase Repository"
        required: false
        default: "poojabasker20/springboot-hello-world"
      codebase_branch:
        description: "Branch of the target codebase to scan"
        required: false
        default: "main"
      gcs_bucket_name:
        description: "Optional GCS Bucket Name (Parses all PDFs in bucket)"
        required: false
        default: "pb-nordea-demo"

jobs:
  ingest-context:
    name: Parse AST & Publish Context Maps
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Governance Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Commit Codebase AST Map (AST_CODE_MAP.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          TARGET_CODEBASE_REPO: ${{ inputs.target_codebase_repo }}
        run: |
          python -c "
          from utils.code_parser import ASTMapPublisher
          publisher = ASTMapPublisher(
              source_code_repo='${{ inputs.target_codebase_repo }}',
              target_sdlc_repo='${{ github.repository }}'
          )
          result = publisher.generate_and_commit_ast_map(
              source_branch='${{ inputs.codebase_branch }}',
              target_branch='main',
              artifact_path='docs/architecture/AST_CODE_MAP.md'
          )
          print(result)
          "

      - name: Parse & Publish Architecture PDF Documents (docs/*.md)
        if: ${{ inputs.gcs_bucket_name != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          python -c "
          from utils.doc_parser import PdfParserService
          service = PdfParserService(
              gcs_bucket_name='${{ inputs.gcs_bucket_name }}',
              github_repo_name='${{ github.repository }}'
          )
          results = service.process_and_publish_all_bucket_documents(
              target_github_branch='main',
              github_output_dir='docs/'
          )
          for r in results:
              print(r)
          "
