name: 01 - Initial Setup & Context Ingestion (AST & Docs)

on:
  workflow_dispatch:
    inputs:
      target_codebase_repo:
        description: "Target Codebase Repository"
        required: false
        default: "poojabasker20/springboot-hello-world"
      codebase_branch:
        description: "Branch of the target codebase to scan"
        required: false
        default: "main"
      gcs_bucket_name:
        description: "Optional GCS Bucket Name (Parses all PDFs in bucket)"
        required: false
        default: "pb-nordea-demo"

jobs:
  ingest-context:
    name: Parse AST & Publish Context Maps
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Governance Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 4. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Start Agentic SDLC FastAPI Service
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GOVERNANCE_REPO: ${{ github.repository }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: "europe-west1"
        run: |
          nohup uvicorn api.main:app --host 0.0.0.0 --port 8000 > fastapi.log 2>&1 &
          echo "Waiting for FastAPI service to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "✓ FastAPI service is healthy and ready!"
              break
            fi
            sleep 1
          done

      - name: 6. Generate & Commit Codebase AST Map (POST /api/v1/ingest/ast)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/api/v1/ingest/ast \
            -H "Content-Type: application/json" \
            -d '{
              "target_codebase_repo": "${{ inputs.target_codebase_repo }}",
              "codebase_branch": "${{ inputs.codebase_branch }}",
              "sdlc_repo": "${{ github.repository }}",
              "sdlc_branch": "main",
              "artifact_path": "docs/architecture/AST_CODE_MAP.md"
            }')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "AST Ingestion API request failed!"
            cat fastapi.log
            exit 1
          fi

      - name: 7. Parse & Publish Architecture PDF Documents (POST /api/v1/ingest/docs)
        if: ${{ inputs.gcs_bucket_name != '' }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/api/v1/ingest/docs \
            -H "Content-Type: application/json" \
            -d '{
              "gcs_bucket_name": "${{ inputs.gcs_bucket_name }}",
              "sdlc_repo": "${{ github.repository }}",
              "target_branch": "main",
              "output_dir": "docs/"
            }')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Response ($http_code): $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Doc Ingestion API request failed!"
            cat fastapi.log
            exit 1
          fi
